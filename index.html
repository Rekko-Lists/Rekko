<!DOCTYPE html>
<html lang="es" data-theme="rekko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rekko is an anime community for discovering shows, sharing recommendations, tracking lists, and exploring posts from other fans." />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="Rekko" />
  <meta property="og:description" content="Discover anime, share recommendations, and explore community posts on Rekko." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/rekko_logo.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Rekko</title>
  <style>
    @font-face {
      font-family: 'Gabarito';
      src: url('/fonts/Gabarito-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
      font-display: swap;
    }
  </style>

  <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/98e839aa23b7429362af39d1/script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Creamos la regla CSS que queremos meter dentro de CookieYes
      const estiloMovil = `
        @media (max-width: 767px) {
          .cky-revisit-consent {
            left: auto !important;
            right: 20px !important;
            bottom: 90px !important;
          }
        }
      `;
      
      // Creamos una etiqueta <style> en tu HTML global para asegurar el tiro
      const styleTag = document.createElement("style");
      styleTag.innerHTML = estiloMovil;
      document.head.appendChild(styleTag);

      // El truco maestro: Esperamos a que CookieYes cree su Shadow DOM e inyectamos el CSS dentro
      const miIntervalo = setInterval(() => {
        const ckyElement = document.getElementById("cky-consent-element") || document.querySelector(".cky-revisit-consent");
        if (ckyElement) {
          // Si usa shadowRoot, le metemos el estilo dentro de su cápsula armada
          if (ckyElement.shadowRoot) {
            const shadowStyle = document.createElement("style");
            shadowStyle.innerHTML = estiloMovil;
            ckyElement.shadowRoot.appendChild(shadowStyle);
            clearInterval(miIntervalo); // Ya lo hemos hackeado, paramos el bucle
          }
        }
      }, 300); // Revisa cada 300ms hasta que el botón aparezca

      // Por seguridad, dejamos de buscar a los 10 segundos para no consumir recursos
      setTimeout(() => clearInterval(miIntervalo), 10000);
    });
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-74XS2PG2ZF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  
    gtag('config', 'G-74XS2PG2ZF');
  </script>
  
</head>
<body class="font-gabarito bg-app-bg text-text-main">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
